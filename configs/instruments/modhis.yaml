# Instrument-fixed parameters for MODHIS (TMT): telescope, detector,
# AO/tracking-camera hardware and data file paths. These don't change
# from one simulation to the next -- per-run parameters (star magnitude,
# exposure time, observing conditions, etc.) live in the user-facing
# .cfg file that references this file via [run] instrument=modhis.

telescope:
  area_m2: 655
  diameter_m: 30

filt:
  filter_path: ./data/filters/
  zp_file: ./data/filters/zeropoints.txt

stel:
  # Stellar model grids. Not instrument-specific, but they live here rather
  # than in the user .cfg so that writing a .cfg is all a user has to do --
  # these point at the models bundled with specsim. Override per run with
  # sim.set_star(phoenix_folder=...), by passing phoenix_folder/sonora_folder
  # to StarParams directly, or by setting them under [stel] in a .cfg.
  phoenix_folder: ./data/stel/phoenix/
  sonora_folder: ./data/stel/sonora/

atm:
  telluric_file: ./data/telluric/psg_out_2020.08.02_l0_800nm_l1_2700nm_res_0.001nm_lon_204.53_lat_19.82_pres_0.5826.fits
  sky_path: ./data/telluric/sky/

spectrograph:
  transmission_file: ./data/instrument/modhis/throughput/transmission_total_nocoupling.txt
  inst_background_file: ./data/instrument/modhis/thermal_background/instbkg_RSPEC.csv
  coupling_path: ./data/instrument/modhis/throughput/coupling/
  order_bounds_file: ./data/instrument/modhis/order_bounds.csv
  atm: 0
  adc: 0
  l0: 500
  l1: 2650
  res: 100000
  res_samp: 3
  pix_vert: 3
  extraction_frac: 0.925
  readnoise: 12
  darknoise: 0.01
  saturation: 100000
  pl_on: 1
  rv_floor: 0.5

ao:
  tt_static: 0.5
  lo_wfe: 0
  defocus: 0
  tt_dynamic_file: ./data/instrument/modhis/ao/TTDYNAMIC_NFIRAOS_091123.csv
  ho_wfe_file: ./data/instrument/modhis/ao/HOWFE_NFIRAOS_091123.csv
  contrast_profile_path: ./data/instrument/modhis/ao/contrastcurves/

track:
  band: JHgap
  fratio: 35
  camera: h2rg
  transmission_file: ./data/instrument/modhis/track/trackingcamera.csv
  texp: 1
  field_r: 0
  aberrations_file: ./data/instrument/modhis/track/HISPEC_ParaxialTel_OAP_TrackCamParax_SpotSizevsField.txt
  blocking_filter_file: ./data/instrument/modhis/track/blocking_filter.TXT
