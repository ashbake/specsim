# Configuration file for VFN ETC mode (phase knife)


[run]
mode=etc_off

# observation information
[obs]
texp=900
texp_frame_set=default
nsamp=16
zenith_angle=45
target_snr=100
target_ccf_snr=5

# star information
[stel]
phoenix_folder=./data/stel/phoenix/
sonora_folder=./data/stel/sonora/
vsini=2
teff=5800
mag=10
pl_teff=1400
pl_mag=15
pl_sep=100
pl_vsini=0
host_diam_mas=0.5

# Filter info, assumes this band for all specified magnitudes
[filt]
zp_file=./data/filters/zeropoints.txt
filter_path=./data/filters/
band=H
family=2mass

# telluric info
[tel]
telluric_file=./data/telluric/psg_out_2020.08.02_l0_800nm_l1_2700nm_res_0.001nm_lon_204.53_lat_19.82_pres_0.5826.fits
sky_path=./data/telluric/sky/
pwv=1.5
seeing_set=good

#instrument settings for HISPEC here
[inst]
transmission_path=./data/instrument/hispec/throughput/
order_bounds_file=./data/instrument/hispec/order_bounds.csv
vfn=1
vfn_coupling_file=./data/instrument/hispec/throughput/vfn/coupling_vs_separation_charge1-vortex_H-band.csv
atm=1
adc=1
l0=800
l1=2650
res=100000
res_samp=3
pix_vert=4
tel_area=76.2
tel_diam=10
pl_on=0
extraction_frac=0.925
readnoise = 7
darknoise = 0.01
saturation= 90000
rv_floor=0.5


[ao]
mode=auto
tt_static=0
lo_wfe=50
defocus=25
tt_dynamic_file=./data/instrument/hispec/ao/TTWFE_HAKA_092823.csv
ho_wfe_file=./data/instrument/hispec/ao/HOWFE_HAKA_092823.csv
mag=default
teff=default
