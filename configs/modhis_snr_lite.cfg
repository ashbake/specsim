# User-facing config: parameters you'll typically change from run to run.
# Instrument-fixed parameters (telescope, detector, AO/tracking-camera
# hardware and file paths) live in configs/instruments/<instrument>.yaml
# -- see specsim/config.py (simulate_from_config) for the full list.

[run]
instrument=modhis

[obs]
# exposure time in seconds
texp=900
# ZA options: 0, 30, 45, 60
zenith_angle=30

[stel]
phoenix_folder=./data/stel/phoenix/
sonora_folder=./data/stel/sonora/
# temp of star in K
teff=5800
# mag of star in filter band defined in [filt]
mag=10
# vsini of star in km/s
vsini=2
# planet separation in mas (if 0, assumes on axis and ignores other pl_* variables)
pl_sep=0
# planet temperature in K
pl_teff=1400
# planet mag in filter band defined in [filt]
pl_mag=19
# planet vsini in km/s
pl_vsini=0

[filt]
# band options: J, H, K, y (the filter family is derived from the band)
band=H

[atm]
# precipitable water vapor of telluric model in mm
pwv=1.5
# seeing options: good, bad, average, code then sets seeing size
seeing_set=good

[ao]
# AO options: auto, NGS (R<14), LGS_ON (R<17), LGS_OFF (R>17)
mode=auto
# ao star magnitude, default sets to [stel] definition
mag=default
# ao star temperature, default sets to [stel] definition
teff=default
# if mag above is quoted in a different band than [filt] band, set this (filter family is auto-derived from the band)
#mag_band=R
