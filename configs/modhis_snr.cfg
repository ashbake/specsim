# User-facing config: parameters you'll typically change from run to run.
# Instrument-fixed parameters (telescope, detector, AO/tracking-camera
# hardware and file paths) live in configs/instruments/<instrument>.yaml,
# selected below by [run] instrument.

[run]
instrument=modhis

[obs]
texp=900
texp_frame_set=default
nsamp=16
zenith_angle=30

[stel]
phoenix_folder=./data/stel/phoenix/
sonora_folder=./data/stel/sonora/
teff=5800
mag=10
vsini=2
pl_teff=1400
pl_mag=19
pl_sep=0
pl_vsini=0

[filt]
# band options: J, H, K, y (the filter family is derived from the band)
band=H

[atm]
pwv=1.5
seeing_set=good

[ao]
#options: auto, NGS (R<14), LGS_ON (R<17), LGS_OFF (R>17)
mode=auto
mag=default
teff=default
# if mag above is quoted in a different band than [filt] band, set this (filter family is auto-derived from the band)
#mag_band=R
