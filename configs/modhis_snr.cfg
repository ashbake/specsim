# Configuration file to run specsim that works with files already included in specsim data folders
[obs]
texp=900
texp_frame_set=default
nsamp=16
zenith_angle=30


[stel]
phoenix_folder=./data/stel/phoenix/
sonora_folder=./data/stel/sonora/
vsini = 2
teff  = 5800
mag   = 10
pl_teff  = 1400
pl_mag   = 19
pl_sep   = 0
pl_vsini = 0

[filt]
zp_file=./data/filters/zeropoints.txt
filter_path=./data/filters/
band=H
family=2mass

[tel]
telluric_file=./data/telluric/psg_out_2020.08.02_l0_800nm_l1_2700nm_res_0.001nm_lon_204.53_lat_19.82_pres_0.5826.fits
skypath=./data/telluric/sky/
pwv=1.5
seeing_set=good

[inst]
transmission_path=./data/instrument/modhis/throughput/
order_bounds_file=./data/instrument/modhis/order_bounds.csv
atm=0
adc=0
l0=500
l1=2650
res=100000
res_samp=3
pix_vert=3
extraction_frac=0.925
tel_area=655
tel_diam = 30
readnoise = 12
darknoise = 0.01
saturation=100000
pl_on=1
rv_floor=0.5


[ao]
#options: auto, NGS (R<14), LGS_ON (R<17), LGS_OFF (R>17)
mode=auto
tt_static=0.5
lo_wfe=0
defocus=0
tt_dynamic_file=./data/instrument/modhis/ao/TTDYNAMIC_NFIRAOS_091123.csv
ho_wfe_file=./data/instrument/modhis/ao/HOWFE_NFIRAOS_091123.csv
mag=default
teff=default
# if mag above is quoted in a different band than [filt] band, set this (filter family is auto-derived from the band)
#mag_band=R
contrast_profile_path = ./data/instrument/modhis/ao/contrastcurves/

[track]
band=JHgap
fratio=35
camera=h2rg
transmission_file=./data/track/trackingcamera.csv
texp=1
field_r=0
aberrations_file=./data/track/HISPEC_ParaxialTel_OAP_TrackCamParax_SpotSizevsField.txt


[run]
# currently for labeling purposes only, not used
plot_prefix=testrun
savename=test.txt
instrument=MODHIS
mode=on_axis