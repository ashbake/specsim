# User-facing config: parameters you'll typically change from run to run.
# Instrument-fixed parameters (telescope, detector, AO/tracking-camera
# hardware and file paths) live in configs/instruments/<instrument>.yaml,
# selected below by [run] instrument.

[run]
instrument=hispec
tag=h4rg

[obs]
texp=900
texp_frame_set=default
nsamp=16
zenith_angle=45
target_snr=100

[stel]
phoenix_folder=./data/stel/phoenix/
sonora_folder=./data/stel/sonora/
teff=5800
mag=10
vsini=2
pl_teff=1400
pl_mag=19
pl_sep=0
pl_vsini=0

[filt]
# band options: J, H, K, y (the filter family is derived from the band)
band=H

[atm]
pwv=1.5
seeing_set=good

[ao]
# options: auto, or a specific mode name from the instrument's AO WFE files
mode=auto
# if you want your ao star to not match the science star, change these next params
mag=default
teff=default
# if mag above is quoted in a different band than [filt] band, set this (filter family is auto-derived from the band)
#mag_band=R
# if you want to override Tt dynamic and ho wfe settings instead of picking
# an AO mode from the instrument's WFE files (NOTE: this override path
# currently has a separate bug in AOSystem.select() -- see specsim/aosystem.py)
#tt_dynamic_set=6
#ho_wfe_set=220
