# User-facing config: parameters you'll typically change from run to run.
# Instrument-fixed parameters (telescope, detector, AO/tracking-camera
# hardware and file paths) live in configs/instruments/<instrument>.yaml,
# selected below by [run] instrument.

[run]
instrument=hispec

[obs]
texp=900
texp_frame_set=default
nsamp=16
zenith_angle=45

[stel]
phoenix_folder=./data/stel/phoenix/
sonora_folder=./data/stel/sonora/
teff=5800
mag=10
vsini=2

[filt]
# band options: J, H, K, y (the filter family is derived from the band)
band=H

[atm]
pwv=1.5
seeing_set=good

[ao]
mode=auto
mag=default
teff=default
# NOTE: if you want your ao star to not match science star, change mag/teff above.
# But if in LGS mode for HISPEC, the dynamic tip/tilt may be overly optimistic
# bc if AO star is out of HISPEC 6" FOV it can't be used to improve
# the dynamic TT with HISPEC controls, but code currently does not know this.
# can force AO mode to LGS_STRAP for HISPEC
# NGS AO performance does not assume added TT improvement from HISPEC so its OK
# if mag above is quoted in a different band than [filt] band, set this (filter family is auto-derived from the band)
#mag_band=R
